name: Sync Blog Posts

concurrency:
  group: review-sync
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-posts.yml'
      - 'apply-glass-header.py'
      - 'apply-performance-optimizations.py'
      - 'migrate-walone.py'
      - 'sync-posts.py'
      - 'generate-tts.py'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply iOS glass header patch
        run: python3 apply-glass-header.py

      - name: Apply performance optimizations
        run: python3 apply-performance-optimizations.py

      - name: Run sync script
        run: python3 sync-posts.py

      - name: Migrate all existing posts to Walone
        run: python3 migrate-walone.py

      - name: Generate Burmese Read Aloud audio
        run: |
          python -m pip install --disable-pip-version-check --no-input edge-tts
          python3 generate-tts.py

      - name: Check for changes
        id: git-check
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
            git status --short
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Auto-sync: Optimize site performance"
          git push origin main
