name: Sync Blog Posts

concurrency:
  group: review-sync
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-posts.yml'
      - 'apply-glass-header.py'
      - 'apply-performance-optimizations.py'
      - 'migrate-walone.py'
      - 'sync-posts.py'
      - 'generate-tts.py'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply iOS glass header patch
        run: python3 apply-glass-header.py

      - name: Apply performance optimizations
        run: python3 apply-performance-optimizations.py

      - name: Run sync script
        run: python3 sync-posts.py

      - name: Migrate all existing posts to Walone
        run: python3 migrate-walone.py

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generate Burmese Read Aloud audio
        run: |
          python -m pip install --disable-pip-version-check --no-input edge-tts
          python3 generate-tts.py

      - name: Validate Burmese Read Aloud audio
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          failures = []
          post_dirs = sorted(Path("audio").glob("[0-9]*"), key=lambda p: int(p.name))
          for post_dir in post_dirs:
              for voice in ("nilar", "thiha"):
                  manifest_path = post_dir / f"{voice}.json"
                  marker_path = post_dir / f"{voice}.sha256"
                  if not manifest_path.exists() or not marker_path.exists():
                      failures.append(f"{post_dir.name}/{voice}: missing manifest or hash")
                      continue
                  try:
                      manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                      chunks = manifest.get("chunks", [])
                  except Exception as exc:
                      failures.append(f"{post_dir.name}/{voice}: invalid manifest ({exc})")
                      continue
                  if not chunks:
                      failures.append(f"{post_dir.name}/{voice}: no chunks")
                  for name in chunks:
                      target = post_dir / name
                      if not target.exists() or target.stat().st_size < 1024:
                          failures.append(f"{post_dir.name}/{voice}: missing or tiny {name}")
          if failures:
              print("Audio validation failures:")
              print("\n".join(failures))
              raise SystemExit(1)
          print(f"Validated {len(post_dirs)} posts with Nilar and Thiha audio.")
          PY

      - name: Check for changes
        id: git-check
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
            git status --short
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Auto-sync: Optimize site performance"
          git push origin main
